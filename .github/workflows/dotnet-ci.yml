name: .NET CI/CD

# Run this workflow ehenever someone pushes to main, or opens/updates a PR targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

# A job is a box of steps that runs together on a machine
# Here, we have a job called 'build,' and it runs on fresh Ubuntu Linux VM that GitHub spins up for us automatically
# The 4 steps inside the job:
# 1. Checkout repository
#     Downloads your code onto that Ubuntu machine - like git clone
# 2. Setup .NET 9 SDK
#     Installs .NET 9 so the machine can understand C#
# 3. Restore dependensies
#     Runs dotnet restore - downloads your NuGet packages
# 4. Build project
#     Compiles the project in Release mode, skipping restore since it's already done
env:
  DOTNET_VERSION: "9.0.x"
  IMAGE_NAME: taskflow-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test ASP.NET Core project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore TaskFlow.sln

      - name: Build solution
        run: dotnet build TaskFlow.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/TaskFlow.Api.UnitTests --configuration Release --no-build --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/TaskFlow.Api.IntegrationTests --configuration Release --no-build --verbosity normal

      - name: Run functional tests
        run: dotnet test tests/TaskFlow.Api.FunctionalTests --configuration Release --no-build --verbosity normal

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test # If build-and-test fails, Docker build never starts

    # Only publish image when pushing to main.
    # For PR, we only want build/test validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/taskflow-api:latest \
            -t ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/taskflow-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/taskflow-api:${{ github.sha }}
